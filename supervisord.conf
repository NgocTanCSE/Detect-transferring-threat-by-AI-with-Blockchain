[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app/backend
environment=PYTHONPATH=/app/backend,PYTHONUNBUFFERED=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM

[program:scanner]
command=python scanner.py
directory=/app/backend
environment=PYTHONPATH=/app/backend,PYTHONUNBUFFERED=1
autostart=true
autorestart=true
startsecs=5
stderr_logfile=/var/log/scanner.err.log
stdout_logfile=/var/log/scanner.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM

[program:frontend]
command=npm run start
directory=/app/frontend
environment=HOSTNAME=0.0.0.0,BACKEND_URL=http://127.0.0.1:8000,NODE_ENV=production
autostart=true
autorestart=true
startsecs=5
stderr_logfile=/var/log/frontend.err.log
stdout_logfile=/var/log/frontend.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM
