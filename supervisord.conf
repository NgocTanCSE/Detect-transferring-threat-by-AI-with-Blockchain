[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ai-service]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/ai-service.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true

[program:scanner]
command=python scanner.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/scanner.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true

[program:event-service]
command=node index.js
directory=/app/services/event-service
environment=REDIS_URL="redis://redis:6379/0"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/event-service.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopasgroup=true

[program:demo-traffic]
command=python demo-scripts/sim_generate_traffic.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",DATABASE_URL="postgresql://blockchain:blockchain_pass@postgres_main:5432/blockchain_main",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/demo-traffic.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopasgroup=true

[program:demo-threats]
command=python demo-scripts/sim_inject_threats.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",API_URL="http://localhost:8000",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/demo-threats.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopasgroup=true
