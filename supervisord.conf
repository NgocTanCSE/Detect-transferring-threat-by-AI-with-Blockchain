[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1",PATH="/usr/local/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
startretries=5
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM
stopwaitsecs=10

[program:scanner]
command=python scanner.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1",PATH="/usr/local/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
startretries=5
stderr_logfile=/var/log/scanner.err.log
stdout_logfile=/var/log/scanner.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM
stopwaitsecs=10

[program:frontend]
command=node server.js
directory=/app/frontend
environment=HOSTNAME="0.0.0.0",PORT="7860",BACKEND_URL="http://127.0.0.1:8000",NODE_ENV="production",PATH="/usr/local/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
startretries=5
stderr_logfile=/var/log/frontend.err.log
stdout_logfile=/var/log/frontend.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM
stopwaitsecs=10
