[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:backend]
command=/bin/bash /app/backend/debug_start.sh
directory=/app/backend
autostart=true
autorestart=true
startsecs=15
startretries=10
stdout_logfile=/var/log/backend.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
exitcodes=0
stopsignal=TERM
stopwaitsecs=10

[program:scanner]
command=python scanner.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=15
startretries=10
stderr_logfile=/var/log/scanner.err.log
stdout_logfile=/var/log/scanner.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM
stopwaitsecs=10

[program:frontend]
command=node server.js
directory=/app/frontend
environment=HOSTNAME="0.0.0.0",PORT="7860",BACKEND_URL="http://127.0.0.1:8000",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=15
startretries=10
stderr_logfile=/var/log/frontend.err.log
stdout_logfile=/var/log/frontend.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
exitcodes=0
stopsignal=TERM
stopwaitsecs=10
