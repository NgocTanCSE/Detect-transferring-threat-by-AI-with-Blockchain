[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/backend.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true

[program:scanner]
command=python scanner.py
directory=/app/backend
environment=PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/scanner.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true

[program:frontend]
command=node server.js
directory=/app/frontend
environment=HOSTNAME="0.0.0.0",PORT="7860",BACKEND_URL="http://127.0.0.1:8000",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/frontend.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
